<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manjot | My Photo</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Hello 👋</h1>

            <p class="subtitle">
                Welcome! Thanks for scanning my QR code.
            </p>

            <!-- Your Photo -->
            <img 
                src="photo.jpg" 
                alt="Manjot's Photo" 
                class="profile-photo"
            >

            <h2>Suraj</h2>

            <p class="message">
                You successfully scanned my QR code! 😊
            </p>

        </div>

    </div>

</body>
</html>
